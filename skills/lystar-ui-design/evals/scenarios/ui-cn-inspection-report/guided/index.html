<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>巡检记录 · 设计验证样例</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--paper:#fff;--ink:#20252b;--muted:#626b76;--line:#dce1e7;--primary:#185bc3;--error:#ad2424;--success:#257340;--space:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}header{background:var(--paper);border-bottom:1px solid var(--line)}.header-inner{max-width:860px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:17px}.example{font-size:12px;color:var(--muted)}main{max-width:860px;margin:24px auto 0;padding:0 24px 150px}.sheet{background:var(--paper);padding:28px;border:1px solid var(--line);border-radius:6px}h1{font-size:24px;line-height:1.45;margin:0 0 8px;overflow-wrap:anywhere}h2{font-size:19px;margin:0 0 10px}p{margin:0 0 12px}.meta{font-size:14px;color:var(--muted)}.device{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--line)}.field{margin:0 0 24px}.label{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}label{font-weight:600}.required{font-size:14px;color:var(--muted);font-weight:400}select,textarea{font:inherit;color:var(--ink);background:var(--paper);width:100%;border:1px solid #aab4c0;border-radius:4px;padding:10px 12px;min-height:46px}textarea{display:block;resize:vertical;min-height:132px;line-height:1.6}.help{font-size:13px;color:var(--muted);margin:8px 0 0}.error{color:var(--error);font-size:14px;margin-top:8px}.error:empty{display:none}.field[hidden],section[hidden],form[hidden],p[hidden]{display:none}button{font:inherit;cursor:pointer;min-height:46px;border:1px solid #9ba8b8;border-radius:4px;background:var(--paper);padding:10px 18px;color:var(--ink)}button.primary{color:#fff;background:var(--primary);border-color:var(--primary)}button:disabled{cursor:wait;opacity:.65}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #277be1;outline-offset:3px}textarea[aria-invalid=true]{border-color:var(--error)}.upload-list{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 0;list-style:none;padding:0}.upload-list li{width:96px}.upload-list img{width:96px;height:96px;object-fit:cover;border-radius:4px;display:block}.upload-list button{font-size:12px;padding:6px 8px;min-height:44px;margin-top:6px;width:100%}.actions{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--paper);padding:12px 24px calc(12px + env(safe-area-inset-bottom))}.action-inner{max-width:812px;margin:auto;display:flex;gap:12px}.action-inner button{flex:1}.status{max-width:812px;margin:0 auto 10px;font-size:14px}.status:empty{display:none}dl{margin:20px 0}dt{color:var(--muted);font-size:14px;margin-top:20px}dd{margin:4px 0 0;overflow-wrap:anywhere}.success-title{color:var(--success)}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}@media(max-width:600px){body{background:var(--paper)}.header-inner{padding:14px 20px}main{margin:0;padding:24px 20px 170px}.sheet{border:0;padding:0;border-radius:0}h1{font-size:21px}.actions{padding-left:20px;padding-right:20px}.device{padding-bottom:20px;margin-bottom:24px}}
</style>
</head>
<body>
<header><div class="header-inner"><strong>填写巡检记录</strong><span class="example">示例数据</span></div></header>
<main>
<section class="sheet" id="editor" aria-label="巡检记录">
<div class="device"><p class="meta" id="device-number">设备编号 SB-024</p><h1 id="device-name">液压成型机冷却循环与高压密封组件</h1><p class="meta" id="device-location">三号车间 · 二号生产线</p></div>
<form id="form" novalidate>
<div class="field"><div class="label"><label for="result">巡检结果</label><span class="required">必填</span></div><select id="result"><option value="normal">正常</option><option value="abnormal">异常</option></select></div>
<div class="field" id="description-field" hidden><div class="label"><label for="description">问题说明</label><span class="required">必填</span></div><textarea id="description" maxlength="300" aria-describedby="description-help description-error" placeholder="填写发现的问题和现场处理情况"></textarea><p class="help" id="description-help"><span id="characters">0</span>/300 字</p><p class="error" id="description-error" role="alert"></p></div>
<div class="field"><div class="label"><label for="photos">现场照片</label><span class="required">选填</span></div><input id="photos" type="file" accept="image/*" multiple aria-describedby="photo-help photo-error"><button type="button" id="choose">添加照片</button><p class="help" id="photo-help">最多 3 张，已选 <span id="photo-count">0</span> 张</p><p class="error" id="photo-error" role="alert"></p><ul class="upload-list" id="photo-list" aria-label="已选照片"></ul></div>
</form>
</section>
<section class="sheet" id="success" hidden tabindex="-1" aria-labelledby="success-title"><h1 id="success-title" class="success-title">巡检记录已提交</h1><p class="meta">设备编号 SB-024</p><dl><dt>巡检结果</dt><dd id="saved-result"></dd><dt id="saved-description-label">问题说明</dt><dd id="saved-description"></dd><dt>现场照片</dt><dd id="saved-photos"></dd></dl><button type="button" id="again">查看填写内容</button></section>
</main>
<div class="actions" id="actions"><p class="status" id="status" role="status" aria-live="polite"></p><p class="status error" id="submit-error" role="alert"></p><div class="action-inner"><button type="button" id="draft">存草稿</button><button type="submit" form="form" id="submit" class="primary">提交记录</button></div></div>
<script>
const form=document.getElementById('form'),result=document.getElementById('result'),description=document.getElementById('description'),descriptionField=document.getElementById('description-field'),error=document.getElementById('description-error'),submit=document.getElementById('submit'),draft=document.getElementById('draft'),status=document.getElementById('status'),submitError=document.getElementById('submit-error'),photos=document.getElementById('photos'),photoList=document.getElementById('photo-list'),photoError=document.getElementById('photo-error');
const draftKey='lystar-eval-inspection-SB-024';let attachments=[],pending=false,attempts=0;
function syncResult(){descriptionField.hidden=result.value!=='abnormal';description.required=result.value==='abnormal';error.textContent='';description.removeAttribute('aria-invalid');document.getElementById('characters').textContent=Array.from(description.value).length;}
function clearFeedback(){submitError.textContent='';status.textContent='';}
result.addEventListener('change',()=>{syncResult();clearFeedback();});description.addEventListener('input',()=>{syncResult();clearFeedback();});
function renderPhotos(){photoList.replaceChildren();attachments.forEach((attachment,index)=>{const li=document.createElement('li'),img=document.createElement('img'),remove=document.createElement('button');img.src=attachment.url;img.alt=attachment.file.name;remove.type='button';remove.textContent='删除';remove.setAttribute('aria-label',`删除照片 ${attachment.file.name}`);remove.addEventListener('click',()=>{URL.revokeObjectURL(attachments[index].url);attachments.splice(index,1);renderPhotos();photoError.textContent='';document.getElementById('choose').focus();});li.append(img,remove);photoList.append(li);});document.getElementById('photo-count').textContent=attachments.length;}
document.getElementById('choose').addEventListener('click',()=>photos.click());photos.addEventListener('change',()=>{const selected=[...photos.files];photoError.textContent='';if(selected.some(file=>!file.type.startsWith('image/'))){photoError.textContent='请选择图片文件。';}else if(attachments.length+selected.length>3){photoError.textContent='最多添加 3 张照片，请重新选择。';}else{selected.forEach(file=>attachments.push({file,url:URL.createObjectURL(file)}));renderPhotos();}photos.value='';});
draft.addEventListener('click',()=>{try{localStorage.setItem(draftKey,JSON.stringify({result:result.value,description:description.value}));status.textContent=attachments.length?'草稿已保存。重新打开后需再次选择照片。':'草稿已保存。';submitError.textContent='';}catch{status.textContent='当前浏览器无法保存草稿，请保留页面。';}});
function setPending(value){pending=value;form.inert=value;submit.disabled=value;draft.disabled=value;submit.textContent=value?'提交中…':'提交记录';}
async function submitAdapter(payload){await new Promise(resolve=>setTimeout(resolve,450));attempts+=1;if(attempts===1)throw new Error('local-eval-failure');return payload;}
form.addEventListener('submit',async event=>{event.preventDefault();if(pending)return;clearFeedback();if(result.value==='abnormal'&&!description.value.trim()){error.textContent='请填写问题说明。';description.setAttribute('aria-invalid','true');description.focus();return;}const payload={result:result.value,description:description.value.trim(),photos:attachments.map(x=>x.file.name)};setPending(true);try{const saved=await submitAdapter(payload);localStorage.removeItem(draftKey);document.getElementById('saved-result').textContent=saved.result==='normal'?'正常':'异常';document.getElementById('saved-description').textContent=saved.result==='abnormal'?saved.description:'—';document.getElementById('saved-description-label').hidden=saved.result==='normal';document.getElementById('saved-description').hidden=saved.result==='normal';document.getElementById('saved-photos').textContent=saved.photos.length?`${saved.photos.length} 张`:'未添加';document.getElementById('editor').hidden=true;document.getElementById('actions').hidden=true;document.getElementById('success').hidden=false;document.getElementById('success').focus();window.scrollTo(0,0);}catch{submitError.textContent='提交失败，已保留填写内容。请重试。';}finally{setPending(false);}});
document.getElementById('again').addEventListener('click',()=>{document.getElementById('success').hidden=true;document.getElementById('editor').hidden=false;document.getElementById('actions').hidden=false;result.focus();});
try{const stored=JSON.parse(localStorage.getItem(draftKey)||'null');if(stored){result.value=stored.result==='abnormal'?'abnormal':'normal';description.value=typeof stored.description==='string'?stored.description.slice(0,300):'';status.textContent='已恢复草稿。';}}catch{}
syncResult();window.addEventListener('pagehide',()=>attachments.forEach(x=>URL.revokeObjectURL(x.url)));
</script>
</body>
</html>
