name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements/all.txt
      - name: Static checks
        run: |
          sh -n install.sh install-lystar-db-ops.sh install-lystar-ssh-ops.sh scripts/install-lib.sh scripts/build-packages.sh
          python -m py_compile scripts/skill-update.py runtime/agent-ops/scripts/*.py
      - name: Runtime tests
        run: python -m unittest discover runtime/agent-ops/tests
      - name: Installer tests
        run: sh tests/test_install.sh
      - name: Package tests
        run: sh tests/test_packages.sh
      - name: Update tests
        run: sh tests/test_update.sh
